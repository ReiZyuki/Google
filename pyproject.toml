[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplesyntax"
version = "0.1.2"
description = "Simple CSS-inspired Python media task library."
requires-python = ">=3.9"
dependencies = ["yt-dlp", "gallery-dl"]
authors = [{name = "ReiZyuki"}]
license = {text = "MIT"}

[tool.setuptools]
packages = ["SimpleSyntax", "simplesyntax"]
package-dir = {SimpleSyntax = ".", simplesyntax = "simplesyntax"}
include-package-data = true

[tool.setuptools.py-modules]
modules = ["core", "downloader", "fallback", "ffmpeg", "image", "manga_api", "media", "metadata", "observer", "parser", "playlist", "utils", "video"]
