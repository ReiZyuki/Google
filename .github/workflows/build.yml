name: Build from Zip
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Fix
        run: |
          ls -la
          for z in *.zip; do unzip -o "$z"; done || true
          rm -f *.zip || true
          ls -la
          FOUND=$(find. -maxdepth 4 -name "package.json" | head -n 1)
          echo "Found: $FOUND"
          if [ "$FOUND"!= "./package.json" ] && [ -n "$FOUND" ]; then
            DIR=$(dirname "$FOUND")
            echo "Moving files from $DIR to root"
            cp -r $DIR/*. || true
            cp -r $DIR/.*. 2>/dev/null || true
          fi
          ls -la
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build || true
      - run: npx cap add android || true
      - run: npx cap copy android
      - run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Runner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
