name: CI

on:
  push:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests yt-dlp gallery-dl
      - name: Compile
        run: python3 -m compileall .
      - name: Run all tests
        run: python3 test_all.py
